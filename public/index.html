<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styling for chat area */
        #message-viewport {
            /* Adjusted to account for fixed header and footer heights */
            max-height: calc(100vh - 140px); /* 64px header + 80px footer/typing = ~140px */
            min-height: calc(100vh - 140px);
            scroll-behavior: smooth;
        }
        /* Ensure the message viewport background covers the area */
        .chat-area-background {
            background-color: #f3f4f6; /* bg-gray-100 */
        }
    </style>
</head>
<body class="bg-gray-50 antialiased">

    <div id="auth-screen" class="flex items-center justify-center h-screen bg-gray-900">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
            <h2 id="auth-title" class="text-3xl font-bold mb-6 text-center text-gray-800">Login to Chat</h2>
            <div id="message-status" class="mb-4 text-center text-sm font-medium text-red-600 hidden"></div>
            
            <form id="auth-form">
                <div class="mb-4">
                    <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="username" name="username" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" name="password" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <button type="submit" id="auth-submit-btn" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md font-semibold hover:bg-blue-700 transition">
                    Login
                </button>
            </form>

            <div class="mt-6 text-center">
                <button id="toggle-auth-btn" class="text-sm text-blue-600 hover:text-blue-800 transition">
                    Need an account? Register
                </button>
            </div>
        </div>
    </div>

    <div id="chat-screen" class="hidden h-screen flex">
        
        <div class="w-72 bg-gray-900 text-white flex flex-col p-4 border-r border-gray-700">
            <h1 class="text-2xl font-bold mb-6 text-blue-400">RealChat</h1>
            
            <div id="user-info" class="mb-4 pb-4 border-b border-gray-700">
                <p class="text-lg font-semibold">
                    <span id="current-user-name"></span>
                </p>
                <button id="create-group-btn" 
                        class="text-xs text-green-400 hover:text-green-300 mr-4 transition">
                    + New Group
                </button>
                <button id="logout-btn" onclick="logout()" 
                        class="text-xs text-red-400 hover:text-red-300 mt-1 transition">
                    Logout
                </button>
            </div>
            
            <div id="user-list" class="flex-1 overflow-y-auto space-y-2">
                </div>
        </div>

        <div class="flex-1 flex flex-col">
            <header class="h-16 p-4 border-b bg-white shadow-md flex items-center">
                <h2 id="current-chat-name" class="text-xl font-semibold text-gray-800"># General</h2>
            </header>

            <div id="message-viewport" class="overflow-y-auto p-6 flex flex-col space-y-4 chat-area-background">
                <p class="text-center text-gray-500 text-sm">Loading chat history...</p>
            </div>

            <div id="typing-indicator" class="h-6 px-6 py-1 text-sm text-gray-600 italic hidden bg-white border-t"></div>

            <footer class="h-20 p-4 border-t bg-white">
                <div class="flex space-x-3">
                    <input type="text" id="message-input" placeholder="Type a message..."
                        class="flex-1 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="send-button"
                        class="bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-700 transition">Send</button>
                </div>
            </footer>
        </div>
    </div>

    <div id="group-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-75 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">Create New Group Chat</h3>
            <div id="group-message-status" class="mb-4 text-sm text-red-500"></div>

            <label for="group-name-input" class="block text-sm font-medium text-gray-700 mb-1">Group Name</label>
            <input type="text" id="group-name-input" class="w-full p-2 border rounded-md mb-4" placeholder="Enter group name" required>

            <label class="block text-sm font-medium text-gray-700 mb-2">Select Members (excluding yourself)</label>
            <div id="group-member-list" class="h-40 overflow-y-auto border p-2 rounded-md mb-4 space-y-1">
                <p class="text-sm text-gray-500">Loading users...</p>
            </div>

            <div class="flex justify-end space-x-3">
                <button onclick="closeGroupModal()" class="px-4 py-2 bg-gray-300 rounded-md hover:bg-gray-400">Cancel</button>
                <button onclick="handleGroupCreationSubmit()" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Create Group</button>
            </div>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="./js/chatClient.js"></script>
</body>
</html>
